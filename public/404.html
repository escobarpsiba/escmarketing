<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - ESC Marketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #ec1c7d; --primary-dark: #c91668; --secondary: #1a1340; --accent: #1ba6e8;
            --dark: #1a1340; --darker: #0f0a2a; --dark-light: #2a2250; --text: #333333; --text-muted: #666666;
            --gradient-1: linear-gradient(135deg, #ec1c7d 0%, #1a1340 100%);
            --glass: rgba(255, 255, 255, 0.9); --glass-border: rgba(0, 0, 0, 0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Poppins', sans-serif; background: #ffffff; color: var(--text);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            overflow:hidden; position:relative;
        }
        .bg-grid {
            position:fixed; inset:0;
            background-image: linear-gradient(rgba(236, 28, 125, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(236, 28, 125, 0.03) 1px, transparent 1px);
            background-size:60px 60px; pointer-events:none;
        }
        .bg-glow {
            position:fixed; width:600px; height:600px; border-radius:50%; filter:blur(120px); opacity:0.15; pointer-events:none;
        }
        .glow-1 { top:-200px; left:-200px; background:var(--primary); }
        .glow-2 { bottom:-200px; right:-200px; background:var(--primary); }
        .content { text-align:center; position:relative; z-index:2; padding:2rem; }
        .error-code {
            font-family:'Poppins',sans-serif; font-size:clamp(6rem,15vw,12rem); font-weight:900;
            line-height:1; color:var(--primary); margin-bottom:0.5rem; animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
        h1 { font-family:'Poppins',sans-serif; font-size:clamp(1.5rem,3vw,2rem); margin-bottom:0.8rem; }
        p { color:var(--text-muted); font-size:1.1rem; margin-bottom:2rem; max-width:500px; margin-left:auto; margin-right:auto; }
        .btn-home {
            display:inline-flex; align-items:center; gap:0.6rem;
            background:var(--primary); color:white; padding:1rem 2.5rem; border-radius:30px;
            text-decoration:none; font-weight:600; font-size:1rem;
            transition:all 0.3s ease;
        }
        .btn-home:hover { transform:translateY(-3px); box-shadow:0 15px 40px rgba(236,28,125,0.3); }
        .links { margin-top:2rem; display:flex; gap:1.5rem; justify-content:center; flex-wrap:wrap; }
        .links a { color:var(--text-muted); text-decoration:none; font-size:0.9rem; transition:color 0.3s; }
        .links a:hover { color:var(--primary); }
        .icon-404 { font-size:4rem; margin-bottom:1rem; display:block; opacity:0.1; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="content">
        <i class="fas fa-compass icon-404"></i>
        <div class="error-code">404</div>
        <h1>Página não encontrada</h1>
        <p>Parece que você seguiu um link que não existe ou a página foi movida.</p>
        <a href="index.html" class="btn-home"><i class="fas fa-arrow-left"></i> Voltar para o Início</a>
        <div class="links">
            <a href="index.html">Início</a>
            <a href="index.html#servicos">Serviços</a>
            <a href="index.html#contato">Contato</a>
            <a href="privacidade.html">Privacidade</a>
        </div>
    </div>
</body>
</html>
